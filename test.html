<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🧪 Test Notification</title>
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "9342b39b-e649-401c-82f9-534c599c2440",
            });
            console.log('✅ OneSignal initialisé');
            document.getElementById('status').innerHTML = '✅ OneSignal prêt';
        });
    </script>
</head>
<body style="font-family: Arial; padding: 20px; background: #0a0a0a; color: white;">
    <h1>🧪 Test de notification</h1>
    
    <div id="status" style="color: yellow;">⏳ Chargement...</div>
    
    <hr>
    
    <h3>📌 Étape 1 : S'abonner</h3>
    <button onclick="subscribe()" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
        🔔 S'abonner aux notifications
    </button>
    <br><br>
    
    <h3>📤 Étape 2 : Envoyer une notification</h3>
    <input id="msg" placeholder="Votre message" style="padding: 10px; width: 300px; border-radius: 5px; border: none;">
    <br><br>
    <button onclick="sendTest()" style="padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;">
        🚀 Envoyer la notification
    </button>
    
    <div id="result" style="margin-top: 20px; padding: 10px; background: #1a1a1a; border-radius: 5px; font-size: 12px; white-space: pre-wrap; color: #aaa;"></div>
    
    <script>
        // Fonction pour s'abonner
        async function subscribe() {
            try {
                const result = await OneSignal.Notifications.requestPermission();
                document.getElementById('result').innerHTML = '✅ Abonnement réussi ! Statut : ' + result;
                alert('✅ Vous êtes maintenant abonné !');
            } catch(e) {
                document.getElementById('result').innerHTML = '❌ Erreur : ' + e.message;
                alert('❌ Erreur : ' + e.message);
            }
        }
        
        // Fonction pour envoyer via le proxy PHP
        async function sendTest() {
            const msg = document.getElementById('msg').value || 'Test depuis GitHub Pages';
            document.getElementById('result').innerHTML = '⏳ Envoi en cours...';
            
            try {
                // 1. Essayer via le proxy PHP
                const response = await fetch('https://x-vps.gamer.gd/n.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: msg,
                        title: 'Test depuis votre site'
                    })
                });
                
                const text = await response.text();
                document.getElementById('result').innerHTML = '📤 Réponse du proxy :\n' + text;
                
                try {
                    const data = JSON.parse(text);
                    if (data.id) {
                        alert('✅ Notification envoyée avec succès !');
                    } else {
                        alert('⚠️ Envoyé mais réponse inattendue : ' + JSON.stringify(data));
                    }
                } catch(e) {
                    alert('⚠️ Le proxy a répondu mais ce n\'est pas du JSON valide');
                }
            } catch(e) {
                document.getElementById('result').innerHTML = '❌ Erreur : ' + e.message;
                alert('❌ Erreur de connexion au proxy : ' + e.message);
            }
        }
    </script>
    
    <hr>
    <p style="color: #666; font-size: 12px;">
        🔗 URL du proxy : https://x-vps.gamer.gd/n.php<br>
        🔗 Votre site : https://shinigami-e.github.io/fille/test.html
    </p>
</body>
</html>

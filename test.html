<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🧪 Test Notification</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "9342b39b-e649-401c-82f9-534c599c2440",
            });
            console.log('✅ OneSignal initialisé');
            document.getElementById('status').innerHTML = '✅ OneSignal prêt';
        });
    </script>
</head>
<body style="font-family: Arial; padding: 20px; background: #0a0a0a; color: white;">
    <h1>🧪 Test de notification</h1>
    <div id="status" style="color: yellow;">⏳ Chargement...</div>
    <hr>
    
    <h3>📌 Étape 1 : S'abonner</h3>
    <button onclick="subscribe()" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
        🔔 S'abonner aux notifications
    </button>
    <br><br>
    
    <h3>📤 Étape 2 : Envoyer une notification</h3>
    <input id="msg" placeholder="Votre message" style="padding: 10px; width: 300px; border-radius: 5px; border: none;" value="Test depuis GitHub Pages">
    <br><br>
    <button onclick="sendTest()" style="padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;">
        🚀 Envoyer
    </button>
    
    <div id="result" style="margin-top: 20px; padding: 10px; background: #1a1a1a; border-radius: 5px; font-size: 12px; white-space: pre-wrap; color: #aaa;"></div>
    
    <script>
        async function subscribe() {
            try {
                const result = await OneSignal.Notifications.requestPermission();
                document.getElementById('result').innerHTML = '✅ Abonnement réussi ! Statut : ' + result;
                alert('✅ Vous êtes maintenant abonné !');
            } catch(e) {
                document.getElementById('result').innerHTML = '❌ Erreur : ' + e.message;
                alert('❌ Erreur : ' + e.message);
            }
        }
        
        async function sendTest() {
            const msg = document.getElementById('msg').value || 'Test';
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '⏳ Envoi en cours...';
            
            try {
                const response = await fetch('https://x-vps.gamer.gd/n.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: msg,
                        title: 'Test depuis votre site'
                    })
                });
                
                const text = await response.text();
                resultDiv.innerHTML = '📤 Réponse :\n' + text;
                
                try {
                    const data = JSON.parse(text);
                    if (data.success) {
                        alert('✅ Notification envoyée !');
                    } else {
                        alert('⚠️ Erreur : ' + (data.error || 'inconnue'));
                    }
                } catch(e) {
                    alert('⚠️ Réponse non-JSON : ' + text.substring(0, 100));
                }
            } catch(e) {
                resultDiv.innerHTML = '❌ Erreur : ' + e.message;
                alert('❌ Erreur : ' + e.message);
            }
        }
    </script>
    
    <hr>
    <p style="color: #666; font-size: 12px;">
        🔗 Proxy : https://x-vps.gamer.gd/n.php<br>
        🔗 Site : https://shinigami-e.github.io/fille/test.html
    </p>
</body>
</html>
